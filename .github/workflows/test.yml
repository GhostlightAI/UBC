name: UBC conformance preview
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --manifest-path core/Cargo.toml --check
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'python[dev]'
      - run: python -m pytest tests -q
      - run: ubc-demo
