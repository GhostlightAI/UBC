[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "ubc-experimental"
version = "0.2.0.dev1"
authors = [{name="Ryan Sloan"}]
description = "Experimental Universal Bot Communication application profile and appliance simulator"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["cryptography>=44", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ubc-demo = "ubc.demo:main"
ubc-relay = "ubc.relay:main"
[tool.setuptools.packages.find]
where = ["."]
